<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b1511">
  <title>Coming Soon... — LoreRoom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #f1e6cc;
      --soft: #e0d0b2;
      --gold: #d2b36f;
      --wine: #6b1e2a;
      --line: rgba(210, 179, 111, .76);
    }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: clamp(16px, 4vw, 48px);
      place-items: center;
      overflow-x: hidden;
      color: var(--ink);
      background: #1b1511;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }
    body::before, body::after { position: fixed; inset: 0; content: ""; pointer-events: none; }
    body::before {
      z-index: -2;
      background: url('./images/backgrounds/comingsoon.jpg') center 48% / 92% auto no-repeat;
    }
    body::after {
      z-index: -1;
      background: linear-gradient(180deg, rgba(20, 14, 11, .35), rgba(20, 14, 11, .73)),
                  radial-gradient(ellipse at center, rgba(20, 14, 11, .10) 0, rgba(20, 14, 11, .56) 100%);
    }
    .frame {
      position: relative;
      width: min(880px, 100%);
      padding: clamp(34px, 7vw, 76px) clamp(20px, 7vw, 76px) clamp(32px, 6vw, 64px);
      border: 1px solid var(--line);
      outline: 1px solid rgba(241, 230, 204, .45);
      outline-offset: -8px;
      background: linear-gradient(145deg, rgba(34, 24, 19, .82), rgba(27, 21, 17, .76));
      box-shadow: 6px 9px 0 rgba(0, 0, 0, .32);
      text-align: center;
      isolation: isolate;
      animation: arrive 850ms ease-out both;
    }
    .eyebrow {
      margin: 0 0 18px;
      color: var(--gold);
      font: 600 11px/1.5 'Cinzel', Georgia, serif;
      letter-spacing: .34em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: var(--ink);
      font: 600 clamp(34px, 7vw, 66px)/1.08 'Cinzel', Georgia, serif;
      letter-spacing: .045em;
      text-wrap: balance;
      text-shadow: 0 3px 24px rgba(0, 0, 0, .42);
    }
    .ornament { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 23px auto 18px; color: var(--gold); }
    .ornament::before, .ornament::after { width: min(18vw, 92px); height: 1px; content: ""; background: linear-gradient(90deg, transparent, var(--line)); }
    .ornament::after { transform: rotate(180deg); }
    .ornament span { font-size: 15px; }
    .intro { max-width: 510px; margin: 0 auto; color: var(--soft); font-size: clamp(19px, 2.5vw, 24px); font-style: italic; line-height: 1.35; }
    .countdown { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 2vw, 20px); max-width: 620px; margin: clamp(30px, 5vw, 48px) auto 0; }
    .unit { min-width: 0; padding: 15px 8px 12px; border: 1px solid rgba(210, 179, 111, .53); background: rgba(18, 13, 11, .48); box-shadow: 2px 3px 0 rgba(0, 0, 0, .22); }
    .value { display: block; color: var(--ink); font: 600 clamp(34px, 7vw, 58px)/1 'Cinzel', Georgia, serif; font-variant-numeric: tabular-nums; }
    .label { display: block; margin-top: 9px; color: var(--gold); font: 600 9px/1.5 'Cinzel', Georgia, serif; letter-spacing: .18em; text-transform: uppercase; }
    .date { margin: 22px 0 0; color: var(--soft); font-size: 16px; font-style: italic; }
    .date time { color: var(--ink); }
    .arrived { margin: 28px 0 0; color: var(--gold); font: 600 13px 'Cinzel', Georgia, serif; letter-spacing: .16em; text-transform: uppercase; }
    [hidden] { display: none !important; }
    @keyframes arrive { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 480px) {
      .frame { padding-inline: 18px; }
      .countdown { gap: 7px; }
      .unit { padding: 13px 3px 10px; }
      .label { font-size: 8px; letter-spacing: .11em; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">LoreRoom · bientôt</p>
    <h1>Une nouvelle page<br> s’écrit</h1>
    <div class="ornament" aria-hidden="true"><span>✦</span></div>
    <p class="intro">Les portes s’ouvriront bientôt. En attendant, le temps défile…</p>

    <section class="countdown" id="countdown" data-target="2026-12-21T00:00:00+01:00" aria-label="Décompte avant l’ouverture">
      <div class="unit"><span class="value" id="days">—</span><span class="label">Jours</span></div>
      <div class="unit"><span class="value" id="hours">—</span><span class="label">Heures</span></div>
      <div class="unit"><span class="value" id="minutes">—</span><span class="label">Minutes</span></div>
      <div class="unit"><span class="value" id="seconds">—</span><span class="label">Secondes</span></div>
    </section>
    <p class="date">Ouverture prévue le <time datetime="2026-12-21T00:00:00+01:00">21 décembre 2026</time></p>
    <p class="arrived" id="arrived" hidden>Les portes sont ouvertes</p>
  </main>
  <script>
    (() => {
      const countdown = document.getElementById('countdown');
      const target = new Date(countdown.dataset.target).getTime();
      const dateLabel = document.querySelector('.date');
      const arrived = document.getElementById('arrived');
      const fields = {
        days: document.getElementById('days'),
        hours: document.getElementById('hours'),
        minutes: document.getElementById('minutes'),
        seconds: document.getElementById('seconds')
      };
      const pad = value => String(value).padStart(2, '0');
      function update() {
        const remaining = target - Date.now();
        if (remaining <= 0) {
          countdown.hidden = true;
          dateLabel.hidden = true;
          arrived.hidden = false;
          return;
        }
        fields.days.textContent = String(Math.floor(remaining / 86400000)).padStart(2, '0');
        fields.hours.textContent = pad(Math.floor(remaining / 3600000) % 24);
        fields.minutes.textContent = pad(Math.floor(remaining / 60000) % 60);
        fields.seconds.textContent = pad(Math.floor(remaining / 1000) % 60);
      }
      update();
      window.setInterval(update, 1000);
    })();
  </script>
</body>
</html>
